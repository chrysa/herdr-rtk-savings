id = "chrysa.rtk-savings"
name = "RTK Savings"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "RTK (Rust Token Killer) token-savings gauges on every space row (savings rate, tokens saved, lifetime fallback). Read straight from RTK's local history database - no subprocess per workspace, no network."
# macOS should work (stdlib only, no platform-specific path) but is untested;
# add it back once someone has actually run it there.
platforms = ["linux"]

[[actions]]
id = "start"
title = "RTK savings: start monitor"
contexts = ["workspace"]
command = ["python3", "monitor.py", "ensure"]

[[actions]]
id = "stop"
title = "RTK savings: stop monitor"
contexts = ["workspace"]
command = ["python3", "monitor.py", "stop"]

# Auto-start the monitor whenever the session produces activity,
# so it survives herdr server restarts without manual action.
[[events]]
on = "workspace.created"
command = ["python3", "monitor.py", "ensure"]

[[events]]
on = "pane.created"
command = ["python3", "monitor.py", "ensure"]

# Re-arm on navigation so a monitor lost to a server restart comes back without
# waiting for a new pane; `ensure` is a pid check that exits when it is alive.
# pane.focused is deliberately not wired: it fires on every mouse move between
# panes, and a python spawn per focus change is not worth the redundancy.
[[events]]
on = "workspace.focused"
command = ["python3", "monitor.py", "ensure"]

[[panes]]
id = "savings"
title = "RTK savings"
placement = "popup"
width = "70%"
height = "45%"
command = ["python3", "monitor.py", "popup"]
